# =============================================================================
# GitLab CI Configuration for SGLang
# =============================================================================
#
# Pipeline structure:  lint -> stage-a -> stage-c (8-gpu-h200) -> finish
#
# =============================================================================

stages:
  - lint
  - stage-a
  - stage-b
  - stage-c
  - finish
  - release

variables:
  SGLANG_IS_IN_CI: "true"
  GIT_DEPTH: 50
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_INDEX_URL: "https://pkgs.d.xiaomi.net/artifactory/api/pypi/pypi-virtual/simple"
  PIP_TRUSTED_HOST: "pkgs.d.xiaomi.net"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    # Only run push pipelines for branches WITHOUT an open MR
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS == null
      when: always

# =============================================================================
# Path patterns (used by rules:changes)
# =============================================================================

.main-package-paths: &main-package-paths
  - python/sglang/**/*
  - python/pyproject.toml
  - scripts/ci/cuda/*
  - scripts/ci/utils/*
  - test/**/*
  - .gitlab-ci.yml

.sgl-kernel-paths: &sgl-kernel-paths
  - sgl-kernel/**/*

# =============================================================================
# Stage: lint
# =============================================================================

lint:
  stage: lint
  image: micr.cloud.mioffice.cn/llm-infra/sglang-ci:latest
  interruptible: true
  timeout: 30m
  script:
    - SKIP=no-commit-to-branch pre-commit run --all-files --show-diff-on-failure
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
      when: on_success

lint-clang-format:
  stage: lint
  image: micr.cloud.mioffice.cn/llm-infra/sglang-ci:latest
  interruptible: true
  timeout: 10m
  script:
    - |
      FAILED=0
      find sgl-kernel/ -name '*.h' -o -name '*.c' -o -name '*.cpp' -o -name '*.hpp' \
        -o -name '*.cu' -o -name '*.cuh' -o -name '*.cc' | while read f; do
        if ! clang-format-20 --style=file --dry-run --Werror "$f" 2>/dev/null; then
          echo "Format error: $f"
          FAILED=1
        fi
      done
      exit $FAILED
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *sgl-kernel-paths
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Requires CI/CD variables ANTHROPIC_API_KEY and GITLAB_API_TOKEN
# (PAT with 'api' scope, used to post the MR note).

claudecode-codereview:
  stage: lint
  image: micr.cloud.mioffice.cn/llm-infra/sglang-ci:latest
  interruptible: true
  timeout: 10m
  allow_failure: true
  variables:
    GIT_DEPTH: 0  # need merge-base with target branch for the review diff
  script:
    - set -o pipefail
    - >
      claude
      -p 'Read .claude/skills/gitlab-codereview/SKILL.md and follow it exactly.
      MR metadata (IID, source/target branches) is in CI_MERGE_REQUEST_*
      environment variables — read them from env, do not expect them in this prompt.
      Print only the final Chinese markdown review to stdout. Do not modify files.'
      --permission-mode default
      --allowedTools "Bash Read Grep Glob Agent"
      2> /tmp/claude.log | tee /tmp/review.md
    - |
      set -o pipefail
      if [ ! -s /tmp/review.md ]; then
        echo "Claude produced an empty review; skipping MR comment."
        echo "--- /tmp/claude.log ---"
        cat /tmp/claude.log || true
        exit 0
      fi
      if [ -z "${GITLAB_API_TOKEN:-}" ]; then
        echo "GITLAB_API_TOKEN not set; skipping MR note post."
        echo "Review content follows:"
        cat /tmp/review.md
        exit 0
      fi
      { echo "### Claude Code Review"; echo; cat /tmp/review.md; } > /tmp/note.md
      python3 -c 'import json,sys; print(json.dumps({"body": sys.stdin.read()}))' \
        < /tmp/note.md > /tmp/note.json
      API_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes"
      HTTP_CODE=$(curl -sS -o /tmp/note_resp.json -w "%{http_code}" \
        --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
        --header "Content-Type: application/json" \
        --data @/tmp/note.json \
        "$API_URL")
      echo "POST $API_URL -> HTTP $HTTP_CODE"
      : "${HTTP_CODE:=000}"
      if [ "$HTTP_CODE" -ge 400 ]; then
        echo "Failed to post MR note (HTTP $HTTP_CODE):"
        cat /tmp/note_resp.json || true
        echo "Review content was:"
        cat /tmp/review.md
        exit 1
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# =============================================================================
# Stage: stage-a (CPU Preflight Tests)
# =============================================================================

stage-a-test-cpu:
  stage: stage-a
  image: micr.cloud.mioffice.cn/llm-infra/sglang-ci:latest
  interruptible: true
  timeout: 30m
  variables:
    KUBERNETES_CPU_REQUEST: "8"
    KUBERNETES_CPU_LIMIT: "16"
    KUBERNETES_MEMORY_REQUEST: "16Gi"
    KUBERNETES_MEMORY_LIMIT: "32Gi"
    # HF_ENDPOINT: K8s pods cannot reach hf-mirror.com; use default huggingface.co
  needs:
    - job: lint
      optional: true
  script:
    - pip install --no-cache-dir -e "python/[test]"
    - cd test/
    - python3 run_suite.py --hw cpu --suite stage-a-test-cpu --enable-retry --max-attempts 2
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *main-package-paths
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
      when: on_success
    - when: never

stage-a-test-1-gpu-small:
  extends:
    - .gpu-test-template
    - .rules-main-package
  stage: stage-a
  tags: [1-gpu-h200]
  needs:
    - job: lint
      optional: true
  script:
    - pip install --no-cache-dir -e "python/[test]"
    - cd test/
    - python3 run_suite.py --hw cuda --suite stage-a-test-1-gpu-small --enable-retry --max-attempts 2

# =============================================================================
# Templates
# =============================================================================

.gpu-test-template:
  image: micr.cloud.mioffice.cn/llm-infra/sglang-ci-gpu:latest
  interruptible: true
  variables:
    SGLANG_CUDA_COREDUMP: "1"
    SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "true"
    SGLANG_CUDA_COREDUMP_DIR: "/tmp/sglang_cuda_coredumps"
  before_script:
    - mkdir -p "$SGLANG_CUDA_COREDUMP_DIR"
  after_script:
    - |
      if [ -d "$SGLANG_CUDA_COREDUMP_DIR" ] && [ "$(ls -A $SGLANG_CUDA_COREDUMP_DIR 2>/dev/null)" ]; then
        echo "CUDA coredumps found:"
        ls -la "$SGLANG_CUDA_COREDUMP_DIR"
      fi
  timeout: 4h
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

.rules-main-package:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *main-package-paths
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
      when: on_success
    - when: never

# =============================================================================
# Stage: stage-b (1-GPU Tests)
# =============================================================================

stage-b-test-1-gpu-small:
  extends:
    - .gpu-test-template
    - .rules-main-package
  stage: stage-b
  tags: [1-gpu-h200]
  parallel: 8
  needs:
    - job: stage-a-test-1-gpu-small
      optional: true
  script:
    - pip install --no-cache-dir -e "python/[test]"
    - pip install "setuptools==70.0.0"
    - pip install "peft==0.18.1"  # peft 0.19+ requires torchao>=0.16 which conflicts with torch 2.9.x bundled torchao 0.9
    - git clone https://github.com/merrymercy/human-eval.git /tmp/human-eval
        && cd /tmp/human-eval && pip install -e . --no-build-isolation && cd -
    - cd test/
    - python3 run_suite.py --hw cuda --suite stage-b-test-1-gpu-small
        --auto-partition-id $((CI_NODE_INDEX - 1))
        --auto-partition-size $CI_NODE_TOTAL
        --enable-retry --max-attempts 2

stage-b-test-1-gpu-large:
  extends:
    - .gpu-test-template
  stage: stage-b
  tags: [1-gpu-h200]
  rules:
    - when: manual
  allow_failure: true  # manual jobs must allow_failure to not block pipeline
  parallel: 14
  needs:
    - job: stage-a-test-1-gpu-small
      optional: true
  script:
    - pip install --no-cache-dir -e "python/[test]"
    - pip install "setuptools==70.0.0"
    - pip install "peft==0.18.1"  # peft 0.19+ requires torchao>=0.16 which conflicts with torch 2.9.x bundled torchao 0.9
    - git clone https://github.com/merrymercy/human-eval.git /tmp/human-eval
        && cd /tmp/human-eval && pip install -e . --no-build-isolation && cd -
    - cd test/
    - python3 run_suite.py --hw cuda --suite stage-b-test-1-gpu-large
        --auto-partition-id $((CI_NODE_INDEX - 1))
        --auto-partition-size $CI_NODE_TOTAL
        --timeout-per-file 1800
        --enable-retry --max-attempts 2

# =============================================================================
# Stage: stage-c (8-GPU H200 Tests)
# =============================================================================

# --- stage-c-test-8-gpu-h200 (4 partitions) ---
# From: .github/workflows/pr-test.yml stage-c-test-8-gpu-h200
# Runs: run_suite.py --hw cuda --suite stage-c-test-8-gpu-h200

stage-c-test-8-gpu-h200:
  extends:
    - .gpu-test-template
  stage: stage-c
  tags: [8-gpu-h200]
  rules:
    - when: manual
  allow_failure: true
  parallel: 4
  needs:
    - job: stage-a-test-cpu
      optional: true
  script:
    - pip install --no-cache-dir -e "python/[test]"
    # - bash scripts/ci/cuda/ci_install_dependency.sh  # pre-installed in sglang-ci-gpu image
    - python3 scripts/ci/cuda/warmup_deep_gemm.py
        deepseek-ai/DeepSeek-V3-0324:8
        deepseek-ai/DeepSeek-V3.2-Exp:8
    - python3 scripts/ci/cuda/warmup_server.py
        deepseek-ai/DeepSeek-V3-0324:8
        inclusionAI/Ring-2.5-1T:8
    - cd test/
    - python3 run_suite.py --hw cuda --suite stage-c-test-8-gpu-h200
        --auto-partition-id $((CI_NODE_INDEX - 1))
        --auto-partition-size $CI_NODE_TOTAL

# --- stage-c-test-deepep-8-gpu-h200 ---
# From: .github/workflows/pr-test.yml stage-c-test-deepep-8-gpu-h200
# Runs: run_suite.py --hw cuda --suite stage-c-test-deepep-8-gpu-h200

stage-c-test-deepep-8-gpu-h200:
  extends:
    - .gpu-test-template
  stage: stage-c
  tags: [8-gpu-h200]
  rules:
    - when: manual
  allow_failure: true
  needs:
    - job: stage-a-test-cpu
      optional: true
  script:
    - bash scripts/ci/cuda/ci_install_deepep.sh
    - python3 scripts/ci/cuda/warmup_deep_gemm.py
        deepseek-ai/DeepSeek-V3-0324:8
        deepseek-ai/DeepSeek-V3.2-Exp:8
    - python3 scripts/ci/cuda/warmup_server.py
        deepseek-ai/DeepSeek-V3-0324:8
    - cd test/
    - python3 run_suite.py --hw cuda --suite stage-c-test-deepep-8-gpu-h200

# =============================================================================
# Stage: finish
# =============================================================================

pr-test-finish:
  stage: finish
  image: micr.cloud.mioffice.cn/llm-infra/alpine:latest
  interruptible: true
  timeout: 5m
  needs:
    - job: stage-a-test-cpu
    - job: stage-a-test-1-gpu-small
    - job: stage-b-test-1-gpu-small
    - job: stage-b-test-1-gpu-large
      optional: true
    - job: stage-c-test-8-gpu-h200
      optional: true
    - job: stage-c-test-deepep-8-gpu-h200
      optional: true
  when: always
  script:
    - echo "Pipeline complete."
    - echo "All upstream jobs have finished."

# =============================================================================
# Stage: release (Docker image build)
# =============================================================================
#
# Mirrors .github/workflows/release-docker.yml publish-x86 (cu129 variant).
# Builds the `framework` target for linux/amd64 and pushes to the internal registry.
# Requires CI_REGISTRY, CI_REGISTRY_USER_IAM, CI_REGISTRY_PASSWORD_IAM CI variables.

.release-docker-template:
  stage: release
  tags: [docker-build]
  rules:
    - when: manual
  allow_failure: true
  timeout: 4h
  needs:
    - job: stage-a-test-cpu
      optional: true
    - job: stage-a-test-1-gpu-small
      optional: true
  variables:
    IMAGE: "micr.cloud.mioffice.cn/llm-infra/sglang"
    GIT_DEPTH: 0
  script:
    - TAG="${BASE_IMAGE_VERSION}-xm-${CI_COMMIT_SHORT_SHA}-$(date +%Y%m%d-%H%M)"
    - echo "Building ${IMAGE}:${TAG}"
    - echo "$CI_REGISTRY_PASSWORD_IAM" | docker login -u "$CI_REGISTRY_USER_IAM" --password-stdin "$CI_REGISTRY"
    - docker build -f docker/Dockerfile.xiaomi --build-arg BASE_IMAGE_VERSION="${BASE_IMAGE_VERSION}" -t "${IMAGE}:${TAG}" .
    - docker push "${IMAGE}:${TAG}"
    - echo "Pushed ${IMAGE}:${TAG}"

release-docker-cu129:
  extends: .release-docker-template
  variables:
    BASE_IMAGE_VERSION: "v0.5.10"

release-docker-cu130:
  extends: .release-docker-template
  variables:
    BASE_IMAGE_VERSION: "v0.5.10-cu130"
