# =============================================================================
# GitLab CI Configuration for SGLang
# =============================================================================
#
# Pipeline: lint -> stage-a -> stage-b -> stage-c -> mimo-test -> finish | release | deploy
#
# =============================================================================

stages:
  - lint
  - stage-a
  - stage-b
  - stage-c
  - mimo-test
  - finish
  - release
  - deploy
  - eval

variables:
  SGLANG_IS_IN_CI: "true"
  GIT_DEPTH: 50
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_INDEX_URL: "https://pkgs.d.xiaomi.net/artifactory/api/pypi/pypi-virtual/simple"
  PIP_TRUSTED_HOST: "pkgs.d.xiaomi.net"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    # Only run push pipelines for branches WITHOUT an open MR
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS == null
      when: always

# =============================================================================
# Path patterns (used by rules:changes)
# =============================================================================

.main-package-paths: &main-package-paths
  - python/sglang/**/*
  - python/pyproject.toml
  - scripts/ci/cuda/*
  - scripts/ci/utils/*
  - scripts/ci/xiaomi/*
  - test/**/*
  - benchmark/**/*
  - .gitlab-ci.yml

.sgl-kernel-paths: &sgl-kernel-paths
  - sgl-kernel/**/*

# =============================================================================
# Stage: lint
# =============================================================================

lint-mr-title:
  stage: lint
  image: micr.cloud.mioffice.cn/llm-infra/ubuntu:24.04
  interruptible: true
  timeout: 5m
  script:
    - bash scripts/ci/xiaomi/check_mr_title.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

lint:
  stage: lint
  image: micr.cloud.mioffice.cn/llm-infra/sglang-ci:latest
  interruptible: true
  timeout: 30m
  script:
    - SKIP=no-commit-to-branch pre-commit run --all-files --show-diff-on-failure
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
      when: on_success

lint-clang-format:
  stage: lint
  image: micr.cloud.mioffice.cn/llm-infra/sglang-ci:latest
  interruptible: true
  timeout: 10m
  script:
    - |
      FAILED=0
      find sgl-kernel/ -name '*.h' -o -name '*.c' -o -name '*.cpp' -o -name '*.hpp' \
        -o -name '*.cu' -o -name '*.cuh' -o -name '*.cc' | while read f; do
        if ! clang-format-20 --style=file --dry-run --Werror "$f" 2>/dev/null; then
          echo "Format error: $f"
          FAILED=1
        fi
      done
      exit $FAILED
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *sgl-kernel-paths
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Requires CI/CD variables ANTHROPIC_API_KEY and GITLAB_API_TOKEN
# (PAT with 'api' scope, used to post the MR note).

claudecode-codereview:
  stage: lint
  image: micr.cloud.mioffice.cn/llm-infra/sglang-ci:latest
  interruptible: true
  timeout: 20m
  allow_failure: true
  variables:
    GIT_DEPTH: 0  # need merge-base with target branch for the review diff
  script:
    - set -o pipefail
    - >
      claude
      -p 'Read .claude/skills/gitlab-codereview/SKILL.md and follow it exactly.
      MR metadata (IID, source/target branches) is in CI_MERGE_REQUEST_*
      environment variables — read them from env, do not expect them in this prompt.
      Print only the final Chinese markdown review to stdout. Do not modify files.'
      --permission-mode default
      --allowedTools "Bash Read Grep Glob Agent"
      2> /tmp/claude.log | tee /tmp/review.md
    - |
      if [ ! -s /tmp/review.md ]; then
        echo "Claude produced an empty review; skipping MR comment."
        cat /tmp/claude.log 2>/dev/null || true
        exit 0
      fi
      { echo "### Claude Code Review"; echo; cat /tmp/review.md; } > /tmp/note.md
      bash scripts/ci/xiaomi/post_mr_note.sh /tmp/note.md
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# =============================================================================
# Stage: stage-a (CPU Preflight Tests)
# =============================================================================

stage-a-test-cpu:
  stage: stage-a
  image: micr.cloud.mioffice.cn/llm-infra/sglang-ci:latest
  interruptible: true
  timeout: 30m
  variables:
    KUBERNETES_CPU_REQUEST: "8"
    KUBERNETES_CPU_LIMIT: "16"
    KUBERNETES_MEMORY_REQUEST: "16Gi"
    KUBERNETES_MEMORY_LIMIT: "32Gi"
    # HF_ENDPOINT: K8s pods cannot reach hf-mirror.com; use default huggingface.co
  needs:
    - job: lint
      optional: true
  script:
    - pip install --no-cache-dir --no-deps -e "python/[test]"
    # TODO(yingchun): remove this once the transfer kernel is included in the base image
    - pip install https://cnbj1-fds.api.xiaomi.net/aie-shared-objects/20260514/transfer_kernel-0.4.1-cp310-abi3-linux_x86_64.whl --no-cache-dir --no-deps --force-reinstall
    - pip install https://cnbj1-fds.api.xiaomi.net/aie-shared-objects/20260603/pos_enc_kernel-0.4.1-cp310-abi3-linux_x86_64.whl --no-cache-dir --no-deps --force-reinstall
    - cd test/
    - python3 run_suite.py --hw cpu --suite stage-a-test-cpu --enable-retry --max-attempts 2
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *main-package-paths
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
      when: on_success
    - when: never

stage-a-test-1-gpu-small:
  extends:
    - .gpu-test-template
    - .rules-main-package
  stage: stage-a
  tags: [1-gpu-h200]
  needs:
    - job: lint
      optional: true
  script:
    - pip install --no-cache-dir -e "python/[test]"
    - cd test/
    - python3 run_suite.py --hw cuda --suite stage-a-test-1-gpu-small --enable-retry --max-attempts 2

# =============================================================================
# Templates
# =============================================================================

.gpu-test-template:
  image: micr.cloud.mioffice.cn/llm-infra/sglang-ci:latest
  interruptible: true
  variables:
    SGLANG_CUDA_COREDUMP: "1"
    SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "true"
    SGLANG_CUDA_COREDUMP_DIR: "/tmp/sglang_cuda_coredumps"
  before_script:
    - mkdir -p "$SGLANG_CUDA_COREDUMP_DIR"
    - |
      # GPU preflight: kill leaked sglang from prior jobs (CUDA_VISIBLE_DEVICES
      # scoped). exit 75 (mapped via retry.exit_codes) lets GitLab reschedule
      # us onto a clean runner if memory still >10% after retries.
      python3 python/sglang/cli/killall.py || exit 75
    # TODO(yingchun): remove this once the transfer kernel is included in the base image
    - pip install https://cnbj1-fds.api.xiaomi.net/aie-shared-objects/20260514/transfer_kernel-0.4.1-cp310-abi3-linux_x86_64.whl --no-cache-dir --no-deps --force-reinstall
    - pip install https://cnbj1-fds.api.xiaomi.net/aie-shared-objects/20260603/pos_enc_kernel-0.4.1-cp310-abi3-linux_x86_64.whl --no-cache-dir --no-deps --force-reinstall
  after_script:
    - |
      if [ -d "$SGLANG_CUDA_COREDUMP_DIR" ] && [ "$(ls -A $SGLANG_CUDA_COREDUMP_DIR 2>/dev/null)" ]; then
        echo "CUDA coredumps found:"
        ls -la "$SGLANG_CUDA_COREDUMP_DIR"
      fi
  timeout: 4h
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
    exit_codes:
      - 75  # GPU preflight bailed; reschedule to a clean runner

.rules-main-package:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *main-package-paths
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
      when: on_success
    - when: never

# =============================================================================
# Stage: stage-b (1-GPU Tests)
# =============================================================================

stage-b-test-1-gpu-small:
  extends:
    - .gpu-test-template
    - .rules-main-package
  stage: stage-b
  tags: [1-gpu-h200]
  parallel: 8
  needs:
    - job: stage-a-test-1-gpu-small
      optional: true
  script:
    - pip install --no-cache-dir -e "python/[test]"
    - pip install "setuptools==70.0.0"
    - pip install "peft==0.18.1"  # peft 0.19+ requires torchao>=0.16 which conflicts with torch 2.9.x bundled torchao 0.9
    - git clone https://github.com/merrymercy/human-eval.git /tmp/human-eval
        && cd /tmp/human-eval && pip install -e . --no-build-isolation && cd -
    - cd test/
    - python3 run_suite.py --hw cuda --suite stage-b-test-1-gpu-small
        --auto-partition-id $((CI_NODE_INDEX - 1))
        --auto-partition-size $CI_NODE_TOTAL
        --enable-retry --max-attempts 2

stage-b-test-1-gpu-large:
  extends:
    - .gpu-test-template
  stage: stage-b
  tags: [1-gpu-h200]
  rules:
    - when: manual
  allow_failure: true  # manual jobs must allow_failure to not block pipeline
  parallel: 14
  needs:
    - job: stage-a-test-1-gpu-small
      optional: true
  script:
    - pip install --no-cache-dir -e "python/[test]"
    - pip install "setuptools==70.0.0"
    - pip install "peft==0.18.1"  # peft 0.19+ requires torchao>=0.16 which conflicts with torch 2.9.x bundled torchao 0.9
    - git clone https://github.com/merrymercy/human-eval.git /tmp/human-eval
        && cd /tmp/human-eval && pip install -e . --no-build-isolation && cd -
    - cd test/
    - python3 run_suite.py --hw cuda --suite stage-b-test-1-gpu-large
        --auto-partition-id $((CI_NODE_INDEX - 1))
        --auto-partition-size $CI_NODE_TOTAL
        --timeout-per-file 1800
        --enable-retry --max-attempts 2

# =============================================================================
# Stage: stage-c (8-GPU H200 Tests)
# =============================================================================

# --- stage-c-test-8-gpu-h200 (4 partitions) ---
# From: .github/workflows/pr-test.yml stage-c-test-8-gpu-h200
# Runs: run_suite.py --hw cuda --suite stage-c-test-8-gpu-h200

stage-c-test-8-gpu-h200:
  extends:
    - .gpu-test-template
  stage: stage-c
  tags: [8-gpu-h200]
  rules:
    - when: manual
  allow_failure: true
  parallel: 4
  needs:
    - job: stage-a-test-cpu
      optional: true
  script:
    - pip install --no-cache-dir -e "python/[test]"
    # - bash scripts/ci/cuda/ci_install_dependency.sh  # pre-installed in sglang-ci image
    - |
      if ! python3 -c "import lmms_eval" 2>/dev/null; then
        rm -rf /tmp/lmms-eval
        git clone --branch v0.5 --depth 1 https://github.com/EvolvingLMMs-Lab/lmms-eval.git /tmp/lmms-eval
        pip install --no-cache-dir -e /tmp/lmms-eval
      fi
    - python3 scripts/ci/cuda/warmup_deep_gemm.py
        deepseek-ai/DeepSeek-V3-0324:8
        deepseek-ai/DeepSeek-V3.2-Exp:8
    - python3 scripts/ci/cuda/warmup_server.py
        deepseek-ai/DeepSeek-V3-0324:8
        inclusionAI/Ring-2.5-1T:8
    - cd test/
    - python3 run_suite.py --hw cuda --suite stage-c-test-8-gpu-h200
        --auto-partition-id $((CI_NODE_INDEX - 1))
        --auto-partition-size $CI_NODE_TOTAL

# --- stage-c-test-deepep-8-gpu-h200 ---
# From: .github/workflows/pr-test.yml stage-c-test-deepep-8-gpu-h200
# Runs: run_suite.py --hw cuda --suite stage-c-test-deepep-8-gpu-h200

stage-c-test-deepep-8-gpu-h200:
  extends:
    - .gpu-test-template
  stage: stage-c
  tags: [8-gpu-h200]
  rules:
    - when: manual
  allow_failure: true
  needs:
    - job: stage-a-test-cpu
      optional: true
  script:
    - bash scripts/ci/cuda/ci_install_deepep.sh
    - python3 scripts/ci/cuda/warmup_deep_gemm.py
        deepseek-ai/DeepSeek-V3-0324:8
        deepseek-ai/DeepSeek-V3.2-Exp:8
    - python3 scripts/ci/cuda/warmup_server.py
        deepseek-ai/DeepSeek-V3-0324:8
    - cd test/
    - python3 run_suite.py --hw cuda --suite stage-c-test-deepep-8-gpu-h200

# =============================================================================
# Stage: finish
# =============================================================================

pr-test-finish:
  stage: finish
  image: micr.cloud.mioffice.cn/llm-infra/alpine:latest
  interruptible: true
  timeout: 5m
  needs:
    - job: stage-a-test-cpu
      optional: true
    - job: stage-a-test-1-gpu-small
      optional: true
    - job: stage-b-test-1-gpu-small
      optional: true
    - job: stage-b-test-1-gpu-large
      optional: true
    - job: stage-c-test-8-gpu-h200
      optional: true
    - job: stage-c-test-deepep-8-gpu-h200
      optional: true
  when: always
  script:
    - echo "Pipeline complete."
    - echo "All upstream jobs have finished."

# =============================================================================
# Stage: release (Docker image build)
# =============================================================================
#
# Mirrors .github/workflows/release-docker.yml publish-x86 (cu129 variant).
# Builds the `framework` target for linux/amd64 and pushes to the internal registry.
# Requires CI_REGISTRY, CI_REGISTRY_USER_IAM, CI_REGISTRY_PASSWORD_IAM CI variables.

.release-docker-template:
  stage: release
  tags: [docker-build]
  rules:
    - when: manual
  allow_failure: true
  timeout: 4h
  needs:
    - job: stage-a-test-cpu
      optional: true
    - job: stage-a-test-1-gpu-small
      optional: true
  variables:
    IMAGE: "micr.cloud.mioffice.cn/llm-infra/sglang"
    GIT_DEPTH: 0
  script:
    - TAG="${BASE_IMAGE_VERSION}-xm-${CI_COMMIT_SHORT_SHA}-$(date +%Y%m%d-%H%M)"
    - echo "Building ${IMAGE}:${TAG}"
    - echo "$CI_REGISTRY_PASSWORD_IAM" | docker login -u "$CI_REGISTRY_USER_IAM" --password-stdin "$CI_REGISTRY"
    - docker build -f docker/Dockerfile.xiaomi --build-arg BASE_IMAGE_VERSION="${BASE_IMAGE_VERSION}" -t "${IMAGE}:${TAG}" .
    - docker push "${IMAGE}:${TAG}"
    - echo "Pushed ${IMAGE}:${TAG}"
    - echo "SGLANG_IMAGE_URL=${IMAGE}:${TAG}" > build.env
  artifacts:
    reports:
      dotenv: build.env

release-docker-cu129:
  extends: .release-docker-template
  variables:
    BASE_IMAGE_VERSION: "v0.5.10"

release-docker-cu130:
  extends: .release-docker-template
  variables:
    BASE_IMAGE_VERSION: "v0.5.10-cu130"

# =============================================================================
# Stage: mimo-test (mimo-v2-flash startup/smoke test)
# =============================================================================

mimo-v2-flash-startup-test:
  extends:
    - .gpu-test-template
  stage: mimo-test
  tags: [8-gpu-h200]
  rules:
    - when: on_success
  allow_failure: true
  timeout: 2h
  variables:
    HF_HUB_OFFLINE: "1"
  needs:
    - job: stage-a-test-1-gpu-small
      optional: true
  script:
    - pip install --no-cache-dir --no-deps -e "python/"
    - |
      if ! python3 -c "import lmms_eval" 2>/dev/null; then
        rm -rf /tmp/lmms-eval
        git clone --branch v0.5 --depth 1 https://github.com/EvolvingLMMs-Lab/lmms-eval.git /tmp/lmms-eval
        pip install --no-cache-dir -e /tmp/lmms-eval
      fi
    - python3 test/registered/8-gpu-models/test_mimo_models.py

mimo-v2-flash-benchmark:
  extends:
    - .gpu-test-template
  stage: mimo-test
  tags: [8-gpu-h200]
  rules:
    - when: on_success
  allow_failure: true
  timeout: 3h
  variables:
    HF_HUB_OFFLINE: "1"
  needs:
    - job: stage-a-test-1-gpu-small
      optional: true
  script:
    - pip install --no-cache-dir --no-deps -e "python/"
    - python3 -c "import deep_ep" 2>/dev/null || bash scripts/ci/cuda/ci_install_deepep.sh
    - bash scripts/ci/xiaomi/benchmark_mimo_v2_flash_prefill.sh
    - MODE=decode bash scripts/ci/xiaomi/benchmark_mimo_v2_flash_decode.sh
    - MODE=mtp bash scripts/ci/xiaomi/benchmark_mimo_v2_flash_decode.sh
    - python3 scripts/ci/xiaomi/summarize_benchmark_results.py
        --title "Prefill Benchmark (mimo-v2-flash)"
        --output benchmark_summary_prefill.md
        --baseline scripts/ci/xiaomi/benchmark_baseline.jsonl
        --compare input_throughput,mean_ttft_ms
        "benchmark_results_prefill-*.json"
    - python3 scripts/ci/xiaomi/summarize_benchmark_results.py
        --title "Decode Benchmark (mimo-v2-flash)"
        --output benchmark_summary_decode.md
        --baseline scripts/ci/xiaomi/benchmark_baseline.jsonl
        --compare output_throughput,mean_tpot_ms
        "benchmark_results_decode-*.json"
    - python3 scripts/ci/xiaomi/summarize_benchmark_results.py
        --title "MTP Decode Benchmark (mimo-v2-flash)"
        --output benchmark_summary_mtp_decode.md
        --baseline scripts/ci/xiaomi/benchmark_baseline.jsonl
        --compare output_throughput,mean_tpot_ms
        "benchmark_results_mtp_decode-*.json"
    - |
      if [ ! -f benchmark_summary_prefill.md ] \
        && [ ! -f benchmark_summary_decode.md ] \
        && [ ! -f benchmark_summary_mtp_decode.md ]; then
        echo "No summary files found; skipping MR note."
        exit 0
      fi
      {
        echo "## MiMo-V2-Flash Benchmark Results"
        echo
        cat benchmark_summary_prefill.md 2>/dev/null || true
        echo
        cat benchmark_summary_decode.md 2>/dev/null || true
        echo
        cat benchmark_summary_mtp_decode.md 2>/dev/null || true
      } > benchmark_note.md
      bash scripts/ci/xiaomi/post_mr_note.sh benchmark_note.md
  artifacts:
    when: always
    paths:
      - mimo_v2_flash_server_*.log
      - benchmark_results_*.json
      - benchmark_summary_*.md
    expire_in: 7 days

# =============================================================================
# Stage: deploy (CloudML deployment)
# =============================================================================

# --- deploy-cloudml-pd (PD disaggregation deployment) ---
# Creates a new multi-role deployment (Prefill + Decode + Router) on CloudML.
# Requires CLOUDML_ACCESS_KEY, CLOUDML_SECRET_KEY, and CLOUDML_MAAS_HOME as CI/CD variables.

deploy-cloudml-pd:
  stage: deploy
  image: micr.cloud.mioffice.cn/llm-infra/sglang-ci:latest
  rules:
    - when: manual
  allow_failure: true
  timeout: 30m
  needs:
    - job: release-docker-cu129
      artifacts: true
  variables:
    CLOUDML_WORKSPACE_ID: "10042"
    CLOUDML_SERVICE_ID: "s-20260428233805-sxie2"
  script:
    - echo "Deploying image ${SGLANG_IMAGE_URL}"
    - bash scripts/ci/xiaomi/deploy_pd.sh --deploy-yaml scripts/ci/xiaomi/flash-1p1d-gm403-hd.yaml

# =============================================================================
# Stage: eval (Accuracy evaluation on CloudML)
# =============================================================================
# Each eval job:
#   1) deploys an sglang server to CloudML via deploy_pd.sh (cleaned up on exit)
#   2) runs an evaluation suite from inside an eval-specific container against
#      the deployed endpoint
#   3) exports summaries as GitLab artifacts and posts a markdown note on the MR
#
# The eval matrix grows along two dimensions:
#   model       : flash / pro / omni
#   eval suite  : basic (mini_eval) / swe-bench / tau-bench / ...
# Job naming convention: "<model>-<eval-suite>", e.g. flash-basic-eval.
#
# Common config lives in .eval-base-template; concrete jobs only specify the
# image, timeout, model-specific CLOUDML_SERVICE_ID, runner script and
# artifact paths.
#
# Bypass deploy: set EVAL_URL=<bare-base-url> in pipeline variables
# to skip the CloudML create/teardown cycle and run the eval against an
# already-deployed service. CLOUDML_* vars are NOT required in this mode.
# See deploy_pd.sh's header for details.
#
# Requires: release-docker-cu129 (for SGLANG_IMAGE_URL).
# Requires: CLOUDML_ACCESS_KEY and CLOUDML_SECRET_KEY as masked CI/CD variables.

.eval-base-template:
  stage: eval
  rules:
    - when: manual
  allow_failure: true
  needs:
    - job: release-docker-cu129
      artifacts: true
  variables:
    CLOUDML_WORKSPACE_ID: "10042"
    # Shared runner pool cap is 64Gi; eval containers are mostly HTTP clients
    # driving traffic to CloudML. Concrete jobs may override these.
    KUBERNETES_CPU_REQUEST: "8"
    KUBERNETES_CPU_LIMIT: "16"
    KUBERNETES_MEMORY_REQUEST: "16Gi"
    KUBERNETES_MEMORY_LIMIT: "32Gi"
  artifacts:
    when: always
    expire_in: 30 days
    # `paths:` must be specified by inheriting jobs.

.omni-eval-template:
  extends: .eval-base-template
  image: micr.cloud.mioffice.cn/llm-infra/omni_eval_ci:v8
  variables:
    CLOUDML_SERVICE_ID: "s-20260514203050-fd4sl"
    KUBERNETES_MEMORY_REQUEST: "64Gi"
    KUBERNETES_MEMORY_LIMIT: "64Gi"
  script:
    - echo "Deploying image ${SGLANG_IMAGE_URL}"
    - bash scripts/ci/xiaomi/run_${MODALITY}_eval.sh --deploy-yaml scripts/ci/xiaomi/omni-epd-gm403-hd.yaml

flash-basic-eval:
  extends: .eval-base-template
  image: micr.cloud.mioffice.cn/llm-infra/mini-eval:3002791-V1
  timeout: 12h
  variables:
    CLOUDML_SERVICE_ID: "s-20260508193803-jw56o"
  script:
    - echo "Evaluating image ${SGLANG_IMAGE_URL}"
    - bash scripts/ci/xiaomi/flash_eval/run_eval.sh --deploy-yaml scripts/ci/xiaomi/flash_eval/flash-1p1d-gm403-hd.yaml
  artifacts:
    paths:
      - mini_eval_output/
      - eval_summary_*.md

omni-image-eval:
  extends: .omni-eval-template
  timeout: 12h
  variables:
    MODALITY: image
    DECODE_NUM: "2"

omni-audio-eval:
  extends: .omni-eval-template
  timeout: 12h
  variables:
    MODALITY: audio

omni-video-eval:
  extends: .omni-eval-template
  timeout: 24h
  variables:
    MODALITY: video
    PREFILL_NUM: "7"
    DECODE_NUM: "7"
    ENCODER_NUM: "4"
# SWE-bench accuracy eval against the same Flash deployment as flash-basic-eval.
#
# This job lands on the docker-build shell runner (sglang-A800-builder), which
# is the same runner used by .release-docker-template. The shell executor
# ignores `image:`, so we explicitly `docker run` mini-swe-agent-ci ourselves
# with /var/run/docker.sock bind-mounted — mini-swe-agent's
# environment_class=docker needs a real dockerd to spawn one container per
# SWE-bench instance, which the K8s shared runner pool cannot provide.
#
# Runtime overrides (set these in "Run Pipeline → Variables" for debug runs):
#   SWE_MAX_SLICE   max SWE-bench instances (default: 500; try 2 for smoke)
#   SWE_WORKERS     concurrent agents      (default: 50;  try 1 for smoke)
#   SWE_MODEL_NAME  served-model-name      (default: mimo-v2-flash)
#   SWE_ENV_CLASS   mini-swe-agent env_class override (default: yaml's docker)
flash-swe-bench:
  extends: .eval-base-template
  tags: [docker-build]
  # Long-running eval (~3h end-to-end) — refuse interruption by auto-cancel
  # on redundant pipelines so an unrelated re-run doesn't kill us mid-eval.
  interruptible: false
  timeout: 12h
  variables:
    CLOUDML_SERVICE_ID: "s-20260508193803-jw56o"
    SWE_EVAL_IMAGE: "micr.cloud.mioffice.cn/llm-infra/mini-swe-agent-ci:V1"
  script:
    - echo "Evaluating image ${SGLANG_IMAGE_URL}"
    # ci_runner.sh handles everything outside the eval container:
    # builds an ephemeral image (scripts baked in), runs it, extracts
    # artifacts via docker cp. Required because this runner's docker CLI
    # points at a REMOTE daemon (bind mounts don't work).
    - bash scripts/ci/xiaomi/flash_swe_bench/ci_runner.sh
  artifacts:
    paths:
      - swe_bench_output/
      - eval_summary_*.md

# tau-bench (telecom domain) accuracy eval against the same Flash deployment.
#
# Unlike flash-swe-bench, tau-bench is pure simulation — no per-task containers,
# no docker socket needed — so this job runs on the K8s shared runner pool with
# a normal `image:` directive.
#
# The image at micr.../tau-bench-ci:V1 bakes /root/tau2-bench/run.sh which
# itself runs `tau2 run --domain telecom ...` three times in a row (team's
# eval protocol — averages 3 runs for the headline number). Our run.sh just
# wires CloudML deployment env vars in and parses the captured stdout.
#
# Required masked CI variable:
#   OPENROUTER_API_KEY   tau-bench user simulator (qwen3-235b on openrouter)
flash-tau-bench:
  extends: .eval-base-template
  image: micr.cloud.mioffice.cn/llm-infra/tau-bench-ci:V1
  # Three sequential `tau2 run` invocations. The CloudML deploy step waits up
  # to 1h for readiness (deploy_pd.sh's wait-for-deployment-ready --timeout
  # 3600), leaving ~2h for the eval itself.
  interruptible: false
  timeout: 3h
  variables:
    CLOUDML_SERVICE_ID: "s-20260508193803-jw56o"
  script:
    - echo "Evaluating image ${SGLANG_IMAGE_URL}"
    - bash scripts/ci/xiaomi/flash_tau_bench/run.sh --deploy-yaml scripts/ci/xiaomi/flash_eval/flash-1p1d-gm403-hd.yaml
  artifacts:
    paths:
      - tau_bench_output/
      - eval_summary_*.md
