- roleName: Prefill
  entryPoint: false
  imageUrl: micr.cloud.mioffice.cn/llm-infra/sglang:v0.5.10-xm
  imageCommand: |-
    python3 -m sglang.launch_server \
                  --model-path XiaomiMiMo/MiMo-V2-Flash \
                  --served-model-name mimo-v2-flash \
                  --disaggregation-ib-device ${NCCL_IB_HCA_NEW} \
                  --disaggregation-mode prefill \
                  --log-level-http warning \
                  --enable-cache-report \
                  --pp-size 1 \
                  --dp-size 2 \
                  --tp-size 8 \
                  --enable-dp-attention \
                  --moe-a2a-backend deepep \
                  --deepep-mode normal \
                  --decode-log-interval 1 \
                  --page-size 1 \
                  --host 0.0.0.0 \
                  --port 9001 \
                  --trust-remote-code \
                  --watchdog-timeout 1000000 \
                  --mem-fraction-static 0.8 \
                  --chunked-prefill-size 16384 \
                  --reasoning-parser qwen3 \
                  --tool-call-parser mimo \
                  --context-length 262144 \
                  --collect-tokens-histogram \
                  --enable-metrics \
                  --bucket-time-to-first-token 0.1 0.2 0.4 0.6 0.8 1 2 4 6 8 10 20 40 60 80 100 200 400 800 1200 1800 2400 3600 5400 7200 \
                  --bucket-e2e-request-latency 0.1 0.2 0.4 0.6 0.8 1 2 4 6 8 10 20 40 60 80 100 200 400 600 1200 1800 2400 3600 5400 7200 \
                  --model-loader-extra-config '{"enable_multithread_load": "true","num_threads": 64}' \
                  --load-balance-method round_robin \
                  --attention-backend fa3 \
                  --allow-auto-truncate \
                  --enable-metrics-for-all-schedulers \
                  --quantization fp8 \
                  --skip-server-warmup \
                  --moe-dense-tp-size 1 \
                  --enable-dp-lm-head \
                  --enable-hierarchical-cache \
                  --hicache-ratio 2.3 \
                  --hicache-mem-layout page_first \
                  --speculative-algorithm EAGLE \
                  --speculative-num-steps 3 \
                  --speculative-eagle-topk 1 \
                  --speculative-num-draft-tokens 4 \
                  --enable-multi-layer-eagle \
                  --disable-tokenizer-batch-decode
  resourceInstance: cloudml.ng1h20e-8-8.20-224
  num: 1
  modelFrame: SGLang
  envs:
  - name: SGLANG_DG_CACHE_DIR
    value: /mnt/deepgemm-cache
  - name: NCCL_IB_HCA_NEW
    value: mlx5_bond_0,mlx5_bond_1,mlx5_bond_2,mlx5_bond_3
  - name: RESOURCE_GPU
    value: '8'
  - name: WORLD_SIZE
    value: '1'
  - name: MC_TE_METRIC
    value: 'true'
  - name: AUTO_MODEL_FILE_PATH
    value: tb_file:'',pth_file:'',train_log_file:'',volume_info:''
  - name: NCCL_IB_DISABLE
    value: '0'
  - name: SGLANG_HEALTH_CHECK_TIMEOUT
    value: '60'
  - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
    value: eth0
  - name: SGLANG_DISAGGREGATION_WAITING_TIMEOUT
    value: '6000'
  - name: SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT
    value: '6000'
  - name: SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE
    value: '10'
  - name: SGLANG_DISAGGREGATION_THREAD_POOL_SIZE
    value: '48'
  - name: SGLANG_DISAGGREGATION_QUEUE_SIZE
    value: '8'
  - name: SGLANG_DISAGGREGATION_HEARTBEAT_INTERVAL
    value: '6'
  - name: CLOUDML_DG_CACHE_DIR
    value: /mnt/deepgemm-cache
  - name: SGLANG_USE_FUSED_MOE_GATE
    value: 'true'
  - name: SGLANG_FORCE_SHUTDOWN
    value: 'true'
  - name: GCACHE_MASTER_ADDR
    value: bj9-cloudml.juicefs.srv
  - name: GCACHE_CACHE_GROUP
    value: mtp-gcache-test
  - name: GCACHE_CLIENT_IFNAME
    value: bond0,bond1,bond2,bond3
  storage:
  - juiceFsSecretConfig:
      volume: aie-gitlab-runner-cache
      treeId: '488416'
      endpoint: bj9-cloudml-ali
      metaUrl: bj9-cloudml-ali.juicefs.srv
      target: ssd-tgt
      readOnly: false
      juiceFsExtra:
        dataBufferTime: 3
        localBufferSize: 0
        memoryBufferSize: 512
        preRead: true
        usageType: default
    mountPath: /root/.cache/huggingface/
    subPath: /huggingface
    source: NEW
