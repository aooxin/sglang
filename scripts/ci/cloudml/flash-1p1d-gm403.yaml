- roleName: LLM-Router
  entryPoint: true
  routerType: LLM-Router
  imageUrl: micr.cloud.mioffice.cn/aie-inference/llm-router:0.3.2
  imageCommand: |-
    ./manager -n ns-3038161 \
        --prefillService ${CLOUDML_MULTI_ROLE_SERVICE_PREFILL} \
        --prefillPort 9001 \
        --decoderService ${CLOUDML_MULTI_ROLE_SERVICE_DECODE} \
        --decoderPort 9001 \
        -r 0 \
        --inferMode 1 \
        -e cntest \
        --routerPort 9001 \
        --framework SGLang \
        --deployType 1 \
        --traceIDKey X-Model-Request-Id
  resourceInstance: cloudml.cputype3-108.1-8
  num: 1
  modelFrame: other
  storage:
  - juiceFsSecretConfig:
      volume: aie-gitlab-runner-cache
      treeId: '488416'
      endpoint: bj9-cloudml-ali
      metaUrl: bj9-cloudml-ali.juicefs.srv
      target: ssd-tgt
      readOnly: false
      juiceFsExtra:
        dataBufferTime: 3
        localBufferSize: 0
        memoryBufferSize: 512
        preRead: true
        usageType: default
    mountPath: /root/.cache/huggingface/
    subPath: /huggingface
    source: NEW
